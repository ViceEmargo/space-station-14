- type: entity
  id: GarrisonBaseGun
  name: garrison gun
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Appearance
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Garrison
  - type: ContainerContainer
    containers:
      pilot-slot: !type:ContainerSlot
      magazine-slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      ammo_slot:
        name: maxim-gun-slot-component-slot-name-ammo
        whitelist:
          tags:
            - Mop
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 250
        layer:
        - MobLayer
        mask:
        - MobMask

- type: entity
  id: MaximGun
  parent: [ GarrisonBaseGun ]
  name: Maxim Gun
  description: BPL14 Armory.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/maxim.rsi
    layers:
    - state: base