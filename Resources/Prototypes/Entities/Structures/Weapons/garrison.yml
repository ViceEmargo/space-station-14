- type: entity
  id: GarrisonBaseGun
  name: garrison gun
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Appearance
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Garrison
  - type: ContainerContainer
    containers:
      pilot-slot: !type:ContainerSlot

- type: entity
  id: MaximGun
  parent: [ GarrisonBaseGun ]
  name: Maxim Gun
  description: BPL14 Armory.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/maxim.rsi
    layers:
    - state: maxim